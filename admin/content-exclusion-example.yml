# Exemple de configuration d'exclusion de contenu.
# En pratique, cela se saisit dans l'interface GitHub :
#   Dépôt :        Settings > Copilot > Content exclusion
#   Organisation : Organization settings > Copilot > Content exclusion
# Montré ici sous forme de fichier uniquement pour que l'auditoire de la démo puisse lire la syntaxe.

# Chemins exclus pour chaque dépôt de l'organisation
"*":
  - "/**/.env"
  - "/**/*.pem"
  - "/**/appsettings.*.json"
  - "/**/secrets/**"

# Chemins exclus pour un dépôt spécifique
"https://github.com/CONTOSO/payments-service":
  - "/src/Billing/Keys/**"
  - "/config/production.yaml"

# Notes pour la démo :
# - Les exclusions bloquent les suggestions en ligne ET le contexte du chat pour les fichiers correspondants.
# - Les changements peuvent prendre jusqu'à ~30 minutes pour se propager, ou rechargez la fenêtre pour forcer un rafraîchissement.
# - Les exclusions sont appliquées à Copilot dans les IDE et, là où c'est pris en charge, sur github.com.
# - Les exclusions ne suppriment PAS rétroactivement ce qui a déjà été suggéré ou validé.
